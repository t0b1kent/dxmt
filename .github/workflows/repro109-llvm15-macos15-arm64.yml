name: REPRO-109 LLVM15 for D3D11 from pinned sources

on:
  # The curator changes this switch only after all source matrix axes are green.
  # The switch is deliberately absent from the initial recipe delivery.
  push:
    branches: [macrunner-d3d12]
    paths:
      - 'build/repro109dxmt/LLVM15-RUN.txt'
  workflow_dispatch:
    inputs:
      wine_recipe_revision:
        description: Full public macrunner-wine revision containing the delivered c9 recipe
        required: true
        default: f73cf96ba8d2fd3e5b3d7e8687fe1c5926204542
        type: string

permissions:
  contents: read

concurrency:
  group: repro109-llvm15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  llvm15:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout DXMT source recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: dxmt
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable sibling revision
        env:
          WINE_RECIPE_REVISION: ${{ inputs.wine_recipe_revision || 'f73cf96ba8d2fd3e5b3d7e8687fe1c5926204542' }}
        run: |
          python3 -I -B - <<'PY'
          import os, re
          if re.fullmatch(r'[a-f0-9]{40}', os.environ['WINE_RECIPE_REVISION']) is None:
              raise SystemExit('Use the full immutable macrunner-wine revision')
          PY
      - name: Checkout pinned public Wine recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: t0b1kent/macrunner-wine
          ref: ${{ inputs.wine_recipe_revision || 'f73cf96ba8d2fd3e5b3d7e8687fe1c5926204542' }}
          path: macrunner-wine
          persist-credentials: false
      - name: Select pinned driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: arm64
      - name: Select pinned Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          selected=0
          for xcode_app in /Applications/Xcode*.app; do
            [ -d "$xcode_app/Contents/Developer" ] || continue
            actual=$(DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version)
            if [ "$actual" = $'Xcode 26.3\nBuild version 17C529' ]; then
              printf 'DEVELOPER_DIR=%s/Contents/Developer\n' "$xcode_app" >> "$GITHUB_ENV"
              selected=1
              break
            fi
          done
          [ "$selected" = 1 ] || { printf 'Pinned Xcode 26.3/17C529 missing\n'; exit 1; }
          printf 'MACRUNNER_WINE_RECIPE_ROOT=%s/macrunner-wine/build\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Verify checkout and all delivered Wine recipe pins
        env:
          WINE_RECIPE_REVISION: ${{ inputs.wine_recipe_revision || 'f73cf96ba8d2fd3e5b3d7e8687fe1c5926204542' }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C macrunner-wine rev-parse HEAD)" = "$WINE_RECIPE_REVISION" ]
          python3 -I -B dxmt/build/repro109dxmt/build_dxmt.py --check-inputs
          python3 -I -B dxmt/build/repro109dxmt/build_llvm15.py
      - name: Build LLVM and static AIR link inputs from official source archives
        shell: bash
        run: |
          bash dxmt/build/repro109dxmt/run_llvm15.sh github-macos15-arm64 \
            "$RUNNER_TEMP/repro109-llvm15-work"
      - name: Collect source outputs and complete bounded logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repro109-llvm15-work"
          out="$RUNNER_TEMP/repro109-llvm15-results"
          mkdir -p "$out"
          if [ -d "$work/reports" ]; then
            cp -R "$work/reports" "$out/reports"
          fi
          if [ -d "$work/prefix" ]; then
            tar -czf "$out/llvm15-prefix.tar.gz" -C "$work/prefix" .
            shasum -a 256 "$out/llvm15-prefix.tar.gz" > "$out/llvm15-prefix.tar.gz.sha256"
          fi
          git -C dxmt rev-parse HEAD > "$out/dxmt-recipe-revision.txt"
          git -C macrunner-wine rev-parse HEAD > "$out/wine-recipe-revision.txt"
      - name: Preserve reports and unsigned LLVM prefix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro109-llvm15-${{ github.sha }}
          path: |
            ${{ runner.temp }}/repro109-llvm15-results/
            ${{ runner.temp }}/repro109-llvm15-work.driver.log
            ${{ runner.temp }}/repro109-llvm15-work.rc.txt
          if-no-files-found: error
          retention-days: 7
