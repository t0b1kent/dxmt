name: REPRO-110 Direct3D 12 layer (d3d12.dll) from the repository

# Builds the x86_64 d3d12.dll of the MacRunner Direct3D 12 layer with llvm-mingw, from public inputs only
# (build/repro110layer/inputs.lock.json), and compares it with the file the project runs.
#   phase=steps : one job per step and mode, fail-fast off, so one run lists every failing step
#   phase=full  : one job per mode that runs all steps and keeps the files for 90 days
# faithful = copy with the authorship notice lines removed (list in ER-V6-SOURCE.json), git describe fixed; expected to
#            give the working file byte for byte (link timestamps aside) when source_ref is the baseline.
# plain    = the tree as committed; objects that use __LINE__ differ by the notice lines, reported as such.
# No push trigger: a push to this repository must not start macOS jobs.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag or branch with the layer sources (baseline tag by default)
        type: string
        default: repro110/layer-baseline-20261014
        required: true
      phase:
        description: steps = one job per step and mode; full = one job per mode
        type: choice
        options: [steps, full]
        default: steps
        required: true
      runner:
        description: Runner label (macOS with Xcode and the Metal compiler)
        type: string
        default: macos-15
        required: true

permissions:
  contents: read

concurrency:
  group: repro110-layer-d3d12
  cancel-in-progress: false

jobs:
  steps:
    name: ${{ matrix.step }} (${{ matrix.mode }})
    if: inputs.phase == 'steps'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {step: fetch, mode: faithful}
          - {step: tree, mode: faithful}
          - {step: tree, mode: plain}
          - {step: configure, mode: faithful}
          - {step: units, mode: faithful}
          - {step: units, mode: plain}
          - {step: build, mode: faithful}
          - {step: build, mode: plain}
    steps:
      - name: Checkout the recipe (this workflow's revision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Checkout the layer sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Select driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Install the pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --disable-pip-version-check meson==1.11.1 ninja==1.13.0
          meson --version; ninja --version; xcrun -sdk macosx metal --version || true
      - name: Run the step
        shell: bash
        env:
          STEP: ${{ matrix.step }}
          MODE: ${{ matrix.mode }}
        run: |
          set -uo pipefail
          set +e
          . "$RUNNER_TEMP/venv/bin/activate"
          python recipe/build/repro110layer/layer_build.py "$STEP" --chain --source "$GITHUB_WORKSPACE/source" \
            --work "$RUNNER_TEMP/work" --mode "$MODE" --jobs 3 > "$RUNNER_TEMP/step.out" 2>&1
          rc=$?
          tail -n 40 "$RUNNER_TEMP/step.out"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -R "$RUNNER_TEMP/work/reports" "$GITHUB_WORKSPACE/out/reports" 2>/dev/null
          cp "$RUNNER_TEMP/step.out" "$GITHUB_WORKSPACE/out/step.out"
          exit $rc
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layer-${{ matrix.step }}-${{ matrix.mode }}
          path: out
          retention-days: 90

  full:
    name: full (${{ matrix.mode }})
    if: inputs.phase == 'full'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [faithful, plain]
    steps:
      - name: Checkout the recipe (this workflow's revision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recipe
          persist-credentials: false
      - name: Checkout the layer sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Select driver Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Install the pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --disable-pip-version-check meson==1.11.1 ninja==1.13.0
          meson --version; ninja --version; xcrun -sdk macosx metal --version || true
      - name: Build
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -uo pipefail
          set +e
          . "$RUNNER_TEMP/venv/bin/activate"
          python recipe/build/repro110layer/layer_build.py all --source "$GITHUB_WORKSPACE/source" \
            --work "$RUNNER_TEMP/work" --mode "$MODE" --jobs 3 > "$RUNNER_TEMP/full.out" 2>&1
          rc=$?
          tail -n 40 "$RUNNER_TEMP/full.out"
          mkdir -p "$GITHUB_WORKSPACE/out/files"
          cp -R "$RUNNER_TEMP/work/reports" "$GITHUB_WORKSPACE/out/reports" 2>/dev/null
          cp "$RUNNER_TEMP/full.out" "$GITHUB_WORKSPACE/out/full.out"
          cp "$RUNNER_TEMP/work/build-$MODE/src/d3d12/d3d12.dll" "$GITHUB_WORKSPACE/out/files/d3d12.dll" 2>/dev/null
          cp "$RUNNER_TEMP/work/build-$MODE/src/dxmt/libdxmt.a.p/dxmt_command.metallib" "$GITHUB_WORKSPACE/out/files/dxmt_command.metallib" 2>/dev/null
          exit $rc
      - name: Keep the reports and the file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layer-full-${{ matrix.mode }}
          path: out
          retention-days: 90
