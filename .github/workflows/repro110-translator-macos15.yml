name: REPRO-110 DXIL to Metal translator tools

# Builds the offline shader translator from the pinned upstream revisions (tools/shader-translator/inputs.lock.json) and
# tests it on two open test shaders. workflow_dispatch only: a push must not start macOS jobs.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro110-translator
  cancel-in-progress: false

jobs:
  offline:
    name: offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Offline tests
        run: python3 -I tools/shader-translator/tests/test_offline.py

  native:
    name: ${{ matrix.cell }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cell: [cross-variants, dxil-frontend, smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Tools
        shell: bash
        run: |
          set -uo pipefail
          set +e
          brew install spirv-tools cmake ninja > "$RUNNER_TEMP/brew.out" 2>&1
          tail -n 3 "$RUNNER_TEMP/brew.out"
          cmake --version | head -1; ninja --version; xcrun -sdk macosx metal --version | head -1; ls /opt/homebrew/bin/spirv-val
          exit 0
      - name: Run the cell
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          TRANSLATOR_JOBS: '3'
        run: |
          set -uo pipefail
          set +e
          cd tools/shader-translator
          W="$RUNNER_TEMP/tr"
          case "$CELL" in
            cross-variants)
              python3 build.py fetch --work "$W" && python3 build.py cross --work "$W" && python3 build.py verify --work "$W" ;;
            dxil-frontend)
              python3 build.py fetch --work "$W" && python3 build.py dxil --work "$W" && python3 build.py frontend --work "$W" ;;
            smoke)
              python3 build.py all --work "$W" && python3 -I tests/test_offline.py && python3 -I tests/test_smoke.py ;;
          esac > "$RUNNER_TEMP/cell.out" 2>&1
          rc=$?
          tail -n 60 "$RUNNER_TEMP/cell.out"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$RUNNER_TEMP/cell.out" "$GITHUB_WORKSPACE/out/cell.out"
          shasum -a 256 lane/build-native/* lane/takeover/*/build-cross/* lane/takeover/admission/build-frontend/* > "$GITHUB_WORKSPACE/out/tool-digests.txt" 2>/dev/null
          exit $rc
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: translator-${{ matrix.cell }}
          path: out
          retention-days: 90
